<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Lycée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f6f3;
    --paper-line: #e4e3dd;
    --ink: #1c2541;
    --ink-soft: #4b5468;
    --grey: #6b7280;
    --red: #b23a48;
    --card: #ffffff;
    --border: #dcdad2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', arial, sans-serif;
  }
  h1, h2, h3, .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---- En-tête ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--paper-line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -.3px;
  }
  .brand .tagline {
    font-size: 12.5px;
    color: var(--grey);
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 3px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.on { background: #2e7d4f; }
  .status-dot.off { background: #9aa0a6; }

  /* ---- Recherche ---- */
  .search-zone {
    padding: 34px 32px 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .search-zone h2 {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    margin: 0 0 14px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }
  .search-box {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 2px;
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    padding: 14px 16px;
    font-family: inherit;
    color: var(--ink);
  }
  .search-box {
    border-bottom: 2px solid var(--border);
    transition: border-color .15s ease;
  }
  .search-box.focused { border-bottom-color: var(--red); }
  .search-box button {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 13px 22px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .search-box button:hover { background: #14192e; }

  /* ---- Corps : sidebar + contenu ---- */
  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 32px 80px;
    gap: 36px;
  }
  .sidebar {
    width: 230px;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--grey);
    margin: 0 0 10px;
  }
  .subject-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 14px;
    border-left: 4px solid transparent;
    color: var(--ink-soft);
  }
  .subject-tab:hover { background: rgba(0,0,0,.03); }
  .subject-tab.active {
    border-left-color: var(--tab-color, var(--red));
    background: rgba(0,0,0,.035);
    color: var(--ink);
    font-weight: 600;
  }
  .subject-chip {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--tab-color, var(--red));
    flex-shrink: 0;
  }

  .content { flex: 1; min-width: 0; }
  .content-header { margin-bottom: 20px; }
  .content-header h2 { font-size: 26px; margin: 0 0 6px; }
  .content-header p { font-size: 13.5px; color: var(--grey); margin: 0; }

  .themes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .fiche-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 18px 20px;
    cursor: pointer;
    position: relative;
  }
  .fiche-card:hover { border-color: var(--ink-soft); }
  .fiche-level {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 10.5px;
    color: var(--grey);
    letter-spacing: .3px;
  }
  .fiche-card h3 {
    font-size: 16px;
    margin: 0 22px 8px 0;
    padding-right: 40px;
  }
  .fiche-card p {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0;
  }

  /* ---- Détail d'une fiche ---- */
  .fiche-detail {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 30px 34px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--grey);
    cursor: pointer;
    margin-bottom: 18px;
  }
  .back-link:hover { color: var(--ink); }
  .fiche-detail h2 {
    font-size: 24px;
    margin: 0 0 4px;
    border-bottom: 3px solid var(--red);
    display: inline-block;
    padding-bottom: 4px;
  }
  .fiche-detail .meta {
    font-size: 12.5px;
    color: var(--grey);
    margin: 10px 0 24px;
  }
  .fiche-detail h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--grey);
    margin: 22px 0 10px;
  }
  .fiche-detail p { font-size: 14.5px; line-height: 1.7; margin: 0; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    background: var(--paper);
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12.5px;
    border-radius: 2px;
  }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li {
    font-size: 14px;
    padding: 6px 0 6px 22px;
    position: relative;
    line-height: 1.5;
  }
  .checklist li::before {
    content: '';
    position: absolute;
    left: 0; top: 12px;
    width: 8px; height: 8px;
    border: 1.5px solid var(--red);
  }
  .example-box {
    background: var(--paper);
    border-left: 3px solid var(--ink-soft);
    padding: 12px 16px;
    font-size: 13.5px;
    font-style: italic;
    color: var(--ink-soft);
  }

  .online-box {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px dashed var(--border);
  }
  .online-box .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #2e7d4f;
    margin-bottom: 10px;
  }
  .loading-line { font-size: 13px; color: var(--grey); }

  .empty-state {
    color: var(--grey);
    font-size: 14px;
    padding: 30px 0;
  }

  /* ---- Responsive ---- */
  @media (max-width: 800px) {
    .layout { flex-direction: column; padding: 10px 18px 60px; }
    .sidebar { width: 100%; display: flex; overflow-x: auto; gap: 4px; }
    .subject-tab { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .subject-tab.active { border-left-color: transparent; border-bottom-color: var(--tab-color, var(--red)); }
    .themes-grid { grid-template-columns: 1fr; }
    header { padding: 16px 18px; flex-wrap: wrap; gap: 10px; }
    .search-zone { padding: 22px 18px 14px; }
    .fiche-detail { padding: 22px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Portail Lycée</h1>
    <span class="tagline">Espace de référence — toutes les matières, tous les niveaux</span>
  </div>
  <div class="status-pill" id="statusPill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Vérification…</span>
  </div>
</header>

<div class="search-zone">
  <h2>Rechercher une matière ou un thème</h2>
  <div class="search-box" id="searchBox">
    <input id="searchInput" type="text" placeholder="Ex : fonctions, Première Guerre mondiale, ondes...">
    <button id="searchBtn">Rechercher</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Matières</div>
    <div id="subjectList"></div>
  </div>
  <div class="content" id="content"></div>
</div>
