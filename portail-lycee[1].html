<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Lycée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f6f3;
    --paper-line: #e4e3dd;
    --ink: #1c2541;
    --ink-soft: #4b5468;
    --grey: #6b7280;
    --red: #b23a48;
    --card: #ffffff;
    --border: #dcdad2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', arial, sans-serif;
  }
  h1, h2, h3, .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---- En-tête ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--paper-line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -.3px;
  }
  .brand .tagline {
    font-size: 12.5px;
    color: var(--grey);
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 3px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.on { background: #2e7d4f; }
  .status-dot.off { background: #9aa0a6; }

  /* ---- Recherche ---- */
  .search-zone {
    padding: 34px 32px 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .search-zone h2 {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    margin: 0 0 14px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }
  .search-box {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 2px;
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    padding: 14px 16px;
    font-family: inherit;
    color: var(--ink);
  }
  .search-box {
    border-bottom: 2px solid var(--border);
    transition: border-color .15s ease;
  }
  .search-box.focused { border-bottom-color: var(--red); }
  .search-box button {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 13px 22px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .search-box button:hover { background: #14192e; }

  /* ---- Corps : sidebar + contenu ---- */
  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 32px 80px;
    gap: 36px;
  }
  .sidebar {
    width: 230px;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--grey);
    margin: 0 0 10px;
  }
  .subject-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 14px;
    border-left: 4px solid transparent;
    color: var(--ink-soft);
  }
  .subject-tab:hover { background: rgba(0,0,0,.03); }
  .subject-tab.active {
    border-left-color: var(--tab-color, var(--red));
    background: rgba(0,0,0,.035);
    color: var(--ink);
    font-weight: 600;
  }
  .subject-chip {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--tab-color, var(--red));
    flex-shrink: 0;
  }

  .content { flex: 1; min-width: 0; }
  .content-header { margin-bottom: 20px; }
  .content-header h2 { font-size: 26px; margin: 0 0 6px; }
  .content-header p { font-size: 13.5px; color: var(--grey); margin: 0; }

  .themes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .fiche-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 18px 20px;
    cursor: pointer;
    position: relative;
  }
  .fiche-card:hover { border-color: var(--ink-soft); }
  .fiche-level {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 10.5px;
    color: var(--grey);
    letter-spacing: .3px;
  }
  .fiche-card h3 {
    font-size: 16px;
    margin: 0 22px 8px 0;
    padding-right: 40px;
  }
  .fiche-card p {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0;
  }

  /* ---- Détail d'une fiche ---- */
  .fiche-detail {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 30px 34px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--grey);
    cursor: pointer;
    margin-bottom: 18px;
  }
  .back-link:hover { color: var(--ink); }
  .fiche-detail h2 {
    font-size: 24px;
    margin: 0 0 4px;
    border-bottom: 3px solid var(--red);
    display: inline-block;
    padding-bottom: 4px;
  }
  .fiche-detail .meta {
    font-size: 12.5px;
    color: var(--grey);
    margin: 10px 0 24px;
  }
  .fiche-detail h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--grey);
    margin: 22px 0 10px;
  }
  .fiche-detail p { font-size: 14.5px; line-height: 1.7; margin: 0; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    background: var(--paper);
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12.5px;
    border-radius: 2px;
  }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li {
    font-size: 14px;
    padding: 6px 0 6px 22px;
    position: relative;
    line-height: 1.5;
  }
  .checklist li::before {
    content: '';
    position: absolute;
    left: 0; top: 12px;
    width: 8px; height: 8px;
    border: 1.5px solid var(--red);
  }
  .example-box {
    background: var(--paper);
    border-left: 3px solid var(--ink-soft);
    padding: 12px 16px;
    font-size: 13.5px;
    font-style: italic;
    color: var(--ink-soft);
  }

  .online-box {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px dashed var(--border);
  }
  .online-box .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #2e7d4f;
    margin-bottom: 10px;
  }
  .loading-line { font-size: 13px; color: var(--grey); }

  .empty-state {
    color: var(--grey);
    font-size: 14px;
    padding: 30px 0;
  }

  /* ---- Responsive ---- */
  @media (max-width: 800px) {
    .layout { flex-direction: column; padding: 10px 18px 60px; }
    .sidebar { width: 100%; display: flex; overflow-x: auto; gap: 4px; }
    .subject-tab { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .subject-tab.active { border-left-color: transparent; border-bottom-color: var(--tab-color, var(--red)); }
    .themes-grid { grid-template-columns: 1fr; }
    header { padding: 16px 18px; flex-wrap: wrap; gap: 10px; }
    .search-zone { padding: 22px 18px 14px; }
    .fiche-detail { padding: 22px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Portail Lycée</h1>
    <span class="tagline">Espace de référence — toutes les matières, tous les niveaux</span>
  </div>
  <div class="status-pill" id="statusPill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Vérification…</span>
  </div>
</header>

<div class="search-zone">
  <h2>Rechercher une matière ou un thème</h2>
  <div class="search-box" id="searchBox">
    <input id="searchInput" type="text" placeholder="Ex : fonctions, Première Guerre mondiale, ondes...">
    <button id="searchBtn">Rechercher</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Matières</div>
    <div id="subjectList"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script src="lycee-data.js"></script>
<script>
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const subjectList = document.getElementById('subjectList');
const content = document.getElementById('content');
const searchInput = document.getElementById('searchInput');
const searchBox = document.getElementById('searchBox');

const tabColors = ['#b23a48', '#2e6f7e', '#8a6d3b', '#4a7c59', '#6b4c9a', '#b2743a', '#3a6bb2', '#7a3a8a', '#2e7d4f', '#a04040', '#5a5a8a', '#8a7a2e'];

function updateStatus() {
  const online = navigator.onLine;
  statusDot.className = 'status-dot ' + (online ? 'on' : 'off');
  statusText.textContent = online ? 'En ligne — compléments Wikipédia actifs' : 'Hors connexion — contenu local uniquement';
}
updateStatus();
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let activeSubjectIndex = 0;

function renderSidebar() {
  subjectList.innerHTML = LYCEE_DATA.matieres.map((m, i) => `
    <div class="subject-tab${i === activeSubjectIndex ? ' active' : ''}" style="--tab-color:${tabColors[i % tabColors.length]}" data-index="${i}">
      <div class="subject-chip"></div>${escapeHtml(m.nom)}
    </div>
  `).join('');
  subjectList.querySelectorAll('.subject-tab').forEach(el => {
    el.addEventListener('click', () => {
      activeSubjectIndex = parseInt(el.dataset.index, 10);
      renderSidebar();
      renderSubjectThemes(activeSubjectIndex);
    });
  });
}

function renderSubjectThemes(index) {
  const subject = LYCEE_DATA.matieres[index];
  content.innerHTML = `
    <div class="content-header">
      <h2>${escapeHtml(subject.nom)}</h2>
      <p>${subject.themes.length} thème${subject.themes.length > 1 ? 's' : ''} de référence</p>
    </div>
    <div class="themes-grid">
      ${subject.themes.map((t, ti) => `
        <div class="fiche-card" data-subject="${index}" data-theme="${ti}">
          <div class="fiche-level mono">${escapeHtml(t.niveaux)}</div>
          <h3>${escapeHtml(t.titre)}</h3>
          <p>${escapeHtml(t.resume.slice(0, 110))}${t.resume.length > 110 ? '…' : ''}</p>
        </div>
      `).join('')}
    </div>
  `;
  content.querySelectorAll('.fiche-card').forEach(card => {
    card.addEventListener('click', () => {
      renderFicheDetail(parseInt(card.dataset.subject, 10), parseInt(card.dataset.theme, 10));
    });
  });
}

function paragraphsToHtml(text) {
  return (text || '').split('\n\n').map(p => `<p>${escapeHtml(p)}</p>`).join('');
}

function renderFicheDetail(subjectIndex, themeIndex) {
  const subject = LYCEE_DATA.matieres[subjectIndex];
  const t = subject.themes[themeIndex];
  content.innerHTML = `
    <div class="back-link" id="backLink">← Retour à ${escapeHtml(subject.nom)}</div>
    <div class="fiche-detail">
      <h2>${escapeHtml(t.titre)}</h2>
      <div class="meta">${escapeHtml(subject.nom)} · Niveaux : ${escapeHtml(t.niveaux)}</div>

      <p style="font-style:italic;color:var(--ink-soft)">${escapeHtml(t.resume)}</p>

      <h4>Cours</h4>
      ${paragraphsToHtml(t.cours)}

      <h4>Notions clés</h4>
      <div class="tag-list">
        ${t.notionsCles.map(n => `<div class="tag">${escapeHtml(n)}</div>`).join('')}
      </div>

      <h4>Objectifs pédagogiques</h4>
      <ul class="checklist">
        ${t.objectifs.map(o => `<li>${escapeHtml(o)}</li>`).join('')}
      </ul>

      <h4>Exemples / applications</h4>
      <div class="example-box">${escapeHtml(t.exemples)}</div>

      <div class="online-box" id="onlineBox" style="display:none">
        <div class="label">● Complément en ligne (Wikipédia, facultatif)</div>
        <div id="onlineContent" class="loading-line">Chargement…</div>
      </div>
    </div>
  `;
  document.getElementById('backLink').addEventListener('click', () => renderSubjectThemes(subjectIndex));

  if (navigator.onLine) {
    loadOnlineComplement(t.titre);
  }
}

async function loadOnlineComplement(title) {
  const box = document.getElementById('onlineBox');
  const box2 = document.getElementById('onlineContent');
  box.style.display = 'block';
  try {
    const searchRes = await fetch(`https://fr.wikipedia.org/w/api.php?action=opensearch&format=json&origin=*&limit=1&search=${encodeURIComponent(title)}`);
    const searchData = await searchRes.json();
    const wikiTitle = (searchData[1] && searchData[1].length) ? searchData[1][0] : title;
    const sumRes = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`);
    if (!sumRes.ok) throw new Error('no summary');
    const data = await sumRes.json();
    box2.classList.remove('loading-line');
    box2.innerHTML = `<p style="font-size:13.5px;line-height:1.7;color:var(--ink-soft)">${escapeHtml(data.extract || '')}</p>`;
  } catch (e) {
    box2.textContent = "Impossible de récupérer un complément en ligne pour ce thème.";
  }
}

/* Recherche : matières + thèmes, contenu local uniquement */
function runSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) return;

  const results = [];
  LYCEE_DATA.matieres.forEach((subject, si) => {
    subject.themes.forEach((t, ti) => {
      const haystack = (subject.nom + ' ' + t.titre + ' ' + t.notionsCles.join(' ')).toLowerCase();
      if (haystack.includes(q)) results.push({ si, ti, subject, t });
    });
  });

  if (!results.length) {
    content.innerHTML = `<div class="empty-state">Aucun résultat local pour « ${escapeHtml(query)} ». Essaie un autre mot-clé, ou parcours les matières dans la colonne de gauche.</div>`;
    return;
  }

  if (results.length === 1) {
    activeSubjectIndex = results[0].si;
    renderSidebar();
    renderFicheDetail(results[0].si, results[0].ti);
    return;
  }

  content.innerHTML = `
    <div class="content-header">
      <h2>Résultats pour « ${escapeHtml(query)} »</h2>
      <p>${results.length} fiche${results.length > 1 ? 's' : ''} trouvée${results.length > 1 ? 's' : ''}</p>
    </div>
    <div class="themes-grid">
      ${results.map(r => `
        <div class="fiche-card" data-subject="${r.si}" data-theme="${r.ti}">
          <div class="fiche-level mono">${escapeHtml(r.t.niveaux)}</div>
          <h3>${escapeHtml(r.t.titre)}</h3>
          <p>${escapeHtml(r.subject.nom)} — ${escapeHtml(r.t.resume.slice(0, 90))}…</p>
        </div>
      `).join('')}
    </div>
  `;
  content.querySelectorAll('.fiche-card').forEach(card => {
    card.addEventListener('click', () => {
      const si = parseInt(card.dataset.subject, 10);
      activeSubjectIndex = si;
      renderSidebar();
      renderFicheDetail(si, parseInt(card.dataset.theme, 10));
    });
  });
}

searchInput.addEventListener('focus', () => searchBox.classList.add('focused'));
searchInput.addEventListener('blur', () => searchBox.classList.remove('focused'));
searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(searchInput.value); });
document.getElementById('searchBtn').addEventListener('click', () => runSearch(searchInput.value));

renderSidebar();
renderSubjectThemes(0);
</script>
</body>
</html>
